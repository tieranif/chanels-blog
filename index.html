<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>chanel f - Scrapbook Blog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Caveat:wght@700&display=swap" rel="stylesheet">
  <style>
    body { box-sizing: border-box; }
    @keyframes float { 0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)} }
      .scrapbook-bg{background-color:var(--paper)}
    .cheetah-pattern {
      background-color: var(--cheetah-base);
      background-image:
        radial-gradient(12px 10px at 8% 20%, var(--cheetah-spot) 40%, transparent 41%),
        radial-gradient(10px 8px at 25% 40%, var(--cheetah-spot) 40%, transparent 41%),
        radial-gradient(14px 10px at 45% 15%, var(--cheetah-spot) 40%, transparent 41%),
        radial-gradient(11px 9px at 72% 35%, var(--cheetah-spot) 40%, transparent 41%),
        radial-gradient(13px 11px at 85% 65%, var(--cheetah-spot) 40%, transparent 41%),
        radial-gradient(9px 7px at 55% 75%, var(--cheetah-spot) 40%, transparent 41%);
      background-size: 320px 320px;
      background-repeat: repeat;
      background-blend-mode: overlay;
    }

  
    .polaroid-card{background:white;padding:12px 12px 40px 12px;box-shadow:0 10px 30px rgba(0,0,0,.15);position:relative;cursor:pointer}
    .handwritten{font-family:'Caveat',cursive}
    .marker-text{font-family:'Permanent Marker',cursive}
    .read-view-content{white-space:pre-wrap}
    .tape{position:absolute;top:-10px;left:40%;width:80px;height:25px;background:rgba(255,235,153,.7);transform:rotate(-4deg)}
    .date-stamp{position:absolute;bottom:8px;right:10px;font-size:14px;color:#555;transform:rotate(-6deg)}
    .coffee-stain{position:absolute;width:120px;height:120px;border:6px solid rgba(120,72,32,.25);border-radius:50%}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50}
    .modal-content{background:#fffdf8;max-width:800px;max-height:90vh;overflow:auto;padding:40px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
  </style>
</head>
<body class="h-full scrapbook-bg cheetah-pattern">
  <main class="max-w-5xl mx-auto px-6 py-16">
    <div class="flex justify-between items-center mb-10">
      <h1 class="marker-text text-4xl"> chanel's blog</h1>
      <button id="toggleMode" class="handwritten text-xl underline">switch view</button>
    </div>
    <section id="posts" class="grid sm:grid-cols-2 gap-12"></section>
    <div id="modal" class="modal hidden"></div>
  </main>

  <script>
    let currentPosts = [
// comments are stored per post in-memory
  {
    __backendId: 'static-animal-farm',
    title: 'animal farm: its basically a mirror 🎱',
    author: 'chanel !',
    createdAt: new Date().toISOString(),
    content: `I first read Animal Farm in 9th grade, and I fell in love immediately. Not because it was easy, short, or “a classic,” but because it felt honest in a way that unsettled me even then. Rereading it recently didn’t make it feel outdated. If anything, it felt uncomfortably current. The story didn’t change, the context did. That shift makes the book feel less like an allegory and more like a mirror, reflecting patterns I hadn’t noticed as a teenager.

The Revolution Was Never the Problem

One of the things that stuck with me is how reasonable the animals are at the beginning. Their demands aren’t radical. They aren’t asking for luxury or dominance, just fairness. Shared labor. Shared reward. No one above anyone else. When I first read this, I remember thinking, “if only real people were this logical.” But Orwell isn’t arguing that equality is unrealistic. He’s arguing that power without structure and accountability will always find a way to protect itself. The pigs don’t overthrow the system violently. They manage it. They administer it. They “handle things.” And everyone else slowly learns that leadership means distance and authority instead of responsibility. This hits differently now as I watch institutions demand loyalty without transparency. I even think about my first internship, where hard work felt like it should equal success, only to realize later that the people in power weren’t accountable to anyone. It felt like watching Napoleon run a farm I’d once naively believed in.

Squealer Isn’t a Villain, He’s a System

Squealer might be the most important character in the book, not because he’s evil, but because he’s effective. He doesn’t lie dramatically. He reframes. He overloads people with information. He speaks confidently enough that doubt feels embarrassing. And when logic fails, he uses fear. Squealer isn’t far off from how modern media can operate. Truth doesn’t disappear, it gets drowned. Confusion does the work for power. He represents communication without accountability, which feels painfully relevant in an age where we scroll faster than we think and trust headlines more than context.

Napoleon, Trump, and the Performance of Strength

Rereading Animal Farm, it’s impossible not to think about Donald Trump’s presidency. Not because Orwell predicted him, but because Orwell understood authoritarian behavior. Napoleon doesn’t lead through competence. He leads through dominance, loyalty tests, and narrative control. Truth becomes whatever keeps him in power. Experts are dismissed. Critics are enemies. Strength is defined by control, not care. I remember a political discussion in high school where I first really noticed this pattern in real life. Facts didn’t matter. Loyalty did. Orwell had already mapped this out decades earlier, on a farm full of pigs.

The Dogs and the Logic of Policing

The dogs aren’t there to protect the animals. They enforce obedience. Fear replaces dialogue. Order becomes more important than justice. Orwell shows how quickly violence becomes normalized when it’s framed as “necessary.” I see this echoed today, especially in the way Trump used ICE. Enforcement wasn’t about care or safety, but compliance and intimidation. Fear became a tool. Just like on the farm, harm is accepted when it’s labeled protection.

Boxer and the Myth of Merit

Boxer hurts the most. His answer to everything is to work harder. That mindset feels painfully familiar. It mirrors generations of Black labor, loyalty, and sacrifice under systems that were never designed to reward us fairly. Orwell isn’t criticizing effort. He’s exposing how systems exploit it. Boxer’s strength is real. What fails him is believing effort guarantees justice. Fairness has to be structural, not conditional.

Education Isn’t Missing, It’s Withheld

What hits harder now is the intentional ignorance on the farm. Most animals can’t read, and the pigs never fix that. Education is uneven by design. Histories are controlled. Power protects itself by limiting knowledge. This resonates deeply today as books about race, history, and inequality are removed from schools. Limiting access to information isn’t neutral, it’s control.

The ending of Animal Farm doesn’t offer redemption. The pigs and humans blur together. Power reveals itself. The animals are left with recognition, not rescue. That’s why the book works. I’ve loved Animal Farm since 9th grade because it respects the reader. It doesn’t explain oppression abstractly. It shows how it grows quietly. Rereading it now doesn’t feel nostalgic. It feels instructional. Animal Farm isn’t just a story. It’s a mirror.`
  }
];
    let scrapbookMode = true;

    function renderPosts() {
      const container = document.getElementById('posts');
      container.innerHTML = '';

      currentPosts.forEach((post, index) => {
        const  = document.createElement('');
        const stainSize = 80 + Math.random() * 120;
        const stainTop = Math.random() * 120;
        const stainLeft = Math.random() * 120;
        const stainRotate = Math.random() * 360;
        article.className = 'polaroid-card cheetah-pattern ${scrapbookMode ? 'hover:rotate-1' : ''};
        article.style.transform = scrapbookMode ? `rotate(${index % 2 === 0 ? '-2deg' : '2deg'})` : 'none';

        article.innerHTML = scrapbookMode
          ? `
            <div class="tape"></div>
            <div class="coffee-stain" style="width:${stainSize}px;height:${stainSize}px;top:${stainTop}px;left:${stainLeft}px;transform:rotate(${stainRotate}deg)"></div>
            <h2 class="marker-text text-3xl mb-2">${post.title}</h2>
            <p class="handwritten text-lg text-gray-600 mb-4">${post.author}</p>
            <p class="handwritten text-xl text-gray-800">${post.content.slice(0, 220)}...</p>
            <div class="date-stamp handwritten">${new Date(post.createdAt).toLocaleDateString()}</div>
          `
          : `
            <h1 class="text-5xl mb-4 marker-text">${post.title}</h1>
            <p class="mb-6 handwritten text-xl text-gray-700">author: ${post.author}</p>
            <div class="handwritten text-xl text-gray-800 read-view-content">${post.content}</div>
          `;

        article.onclick = () => openModal(post);
        container.appendChild(article);
      });
    }

    function openModal(post){
      const modal=document.getElementById('modal');
      modal.innerHTML=`
        <div class="modal-content">
          <h1 class="marker-text text-5xl mb-4">${post.title}</h1>
          <p class="handwritten text-xl mb-4">${post.author} · ${new Date(post.createdAt).toLocaleDateString()}</p>
          <div class="handwritten text-xl read-view-content">${post.content}</div>
          <section class="mt-10">
            <h3 class="marker-text text-2xl mb-4">leave a note ✍🏾</h3>
            <textarea id="commentInput" class="w-full border p-3 handwritten" placeholder="write what this made you think about..."></textarea>
            <button class="handwritten underline mt-3" onclick="addComment('${post.__backendId}')">post</button>
            <div id="comments-${post.__backendId}" class="mt-6 space-y-4 handwritten"></div>
          </section>
          <button class="handwritten underline mt-8" onclick="closeModal()">close</button>
        </div>`;
      modal.classList.remove('hidden');
    }

    let commentsStore = {};

    function addComment(postId){
      const input=document.getElementById('commentInput');
      if(!input.value.trim()) return;
      if(!commentsStore[postId]) commentsStore[postId]=[];
      commentsStore[postId].push({text:input.value,date:new Date()});
      input.value='';
      renderComments(postId);
    }

    function renderComments(postId){
      const el=document.getElementById(`comments-${postId}`);
      if(!el) return;
      el.innerHTML='';
      (commentsStore[postId]||[]).forEach(c=>{
        const div=document.createElement('div');
        div.innerHTML=`<p>${c.text}</p><span class="text-sm text-gray-500">${c.date.toLocaleString()}</span>`;
        el.appendChild(div);
      });
    }

    function closeModal(){
      document.getElementById('modal').classList.add('hidden');
    }

    function init() {
      document.getElementById('toggleMode').onclick = () => {
        scrapbookMode = !scrapbookMode;
        renderPosts();
      };
      renderPosts();
    }

    init();
  </script>
</body>
</html>
